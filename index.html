<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Drakenrijder 3D - Versie 2</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="hud">
    <div class="panel">
      <h1>Drakenrijder 3D</h1>

      <div class="bar-wrap">
        <label>Leven</label>
        <div class="bar"><div id="healthFill" class="fill health"></div></div>
        <span id="healthText"></span>
      </div>

      <div class="bar-wrap">
        <label>Magie</label>
        <div class="bar"><div id="manaFill" class="fill mana"></div></div>
        <span id="manaText"></span>
      </div>

      <div class="bar-wrap">
        <label>Draak-band</label>
        <div class="bar"><div id="bondFill" class="fill bond"></div></div>
        <span id="bondText"></span>
      </div>

      <div class="quest">
        <strong>Quest:</strong>
        <div id="questText">Praat met Brom.</div>
      </div>

      <div class="controls">
        <strong>Besturing</strong><br>
        WASD = lopen / vliegen<br>
        Shift = sneller<br>
        Spatie = springen / stijgen<br>
        C = dalen met draak<br>
        E = praten / opstappen / afstappen<br>
        F = zwaardaanval<br>
        R = magie / drakenvuur<br>
        Q = draak roepen
      </div>
    </div>
  </div>

  <div id="dialogue" class="hidden">
    <div class="dialogue-box">
      <div id="dialogueName"></div>
      <div id="dialogueText"></div>
      <div class="dialogueHint">Druk E om verder te gaan</div>
    </div>
  </div>

  <div id="messageBox" class="hidden"></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
